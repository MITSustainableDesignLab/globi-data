Name: Lisbon Building Model (Derived from Lisbon_v4.json UMI templates)
Fields:
  - Name: Region
    Description: The official climate zone for building regulations (based on RCCTE). Lisbon is primarily I1_V2.
    Options:
      - "I1_V2"
  - Name: City 
    Description: The city of the building.
    Options:
      - "LS"
  - Name: Typology
    Description: The primary building use and form, derived from template names.
    Options:
      - "Single_Family_Residential"
      - "Multi_Family_Residential"
  - Name: Age_buckets
    Description: The construction era, derived from file names and template names in Lisbon_v4.json.
    Options:
      - "pre_1919"
      - "1919_1945"
      - "1946_1960"
      - "1961_1970"
      - "1971_1980"
      - "1981_1990"
      - "1991_1995"
      - "1996_2000"
      - "2001_2005"
      - "post_2006"
  - Name: scenario
    Options:
      - "Baseline"
      - "Retrofit"
      # - "Retrofit Facade"
      # - "Retrofit Windows"
      # - "Retrofit Heat Pump"
      # # - "Retrofit Roof"
      # - "Insulation"
  # - Name: Insulation_Retrofit_Scenario
  #   Description: The insulation retrofit scenario of the building.
  #   Options:
  #     - "Retrofit Facade"
  #     - "Baseline"
  # - Name: Windows_Retrofit_Scenario
  #   Description: The windows retrofit scenario of the building.
  #   Options:
  #     - "Retrofit Windows"
  #     - "Baseline"
  # - Name: Heating_Retrofit_Scenario
  #   Description: The heating retrofit scenario of the building.
  #   Options:
  #     - "Retrofit Heat Pump"
  #     - "Baseline"
  # - Name: Roof_Retrofit_Scenario
  #   Description: The cooling retrofit scenario of the building.
  #   Options:
  #     - "Retrofit Roof"
  #     - "Baseline"

Height_col: height
Num_Floors_col: num_storeys
GFA_col: footprint_area
Building_ID_col: building_id
